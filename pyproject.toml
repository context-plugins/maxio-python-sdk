[project]
name = "maxio-advanced-billing"
version = "1.0"
description = "\nMaxio Advanced Billing (formerly Chargify) provides an HTTP-based API that conforms to the principles of REST.\nOne of the many reasons to use Advanced Billing is the immense feature set and [client libraries](page:development-tools/client-libraries).\nThe Maxio API returns JSON responses as the primary and recommended format, but XML is also provided as a backwards compatible option for merchants who require it.\n\n## Steps to make your first Maxio Advanced Billing API call\n\n1. [Sign-up](https://app.chargify.com/signup/maxio-billing-sandbox) or [log-in](https://app.chargify.com/login.html) to your [test site](https://maxio.zendesk.com/hc/en-us/articles/24250712113165-Testing-Overview) account.\n2. [Setup authentication](https://maxio.zendesk.com/hc/en-us/articles/24294819360525-API-Keys) credentials.\n3. [Submit an API request and verify the response](page:development-tools/client-libraries#make-your-first-maxio-advanced-billing-api-request).\n5. Test the Advanced Billing [integrations](https://www.maxio.com/integrations).\n\nNext, you can explore [authentication methods](page:introduction/authentication), [basic concepts](page:introduction/basic-concepts/connected-sites) for interacting with Advanced Billing via the API, and the entire set of [application-based documentation](https://docs.maxio.com/hc/en-us) to aid in your discovery of the product.\n\n### Request Example\n\nThe following example uses the curl command-line tool to make an API request.\n\n**Request**\n\n    curl -u <api_key>:x -H Accept:application/json -H Content-Type:application/json https://acme.chargify.com/subscriptions.json"
authors = [
    { email = "support@maxio.com" },
]
maintainers = [
    { name = "APIMatic", email = "support@apimatic.io" },
]
keywords = ["sdk", "api-client", "openapi", "rest", "http", "apimatic"]
license = "MIT"                 # SPDX expression (PEP 639); poetry-core bundles the root LICENSE
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx (>=0.28.1,<1.0.0)",
    # 2.11 added the alias-control `model_config` keys core/models.py names --
    # validate_by_name, validate_by_alias and serialize_by_alias. No 2.12-only pydantic API
    # is used anywhere.
    "pydantic[email] (>=2.11.0,<3.0.0)",
    # NotRequired / TypedDict backport for the 3.10 floor (both live in `typing` from 3.11),
    # used by the model input companions; and TypeForm (PEP 747, added in 4.13.0), which
    # core/ uses to type the runtime type expressions its factories accept. PEP 747 is Final
    # and TypeForm reaches `typing` in 3.15, so both move when the floor does.
    "typing-extensions (>=4.13.0,<5.0.0)",
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    # 2.2 is where PEP 747 TypeForm became default-on; below it, core/'s signatures need an
    # --enable-incomplete-feature flag.
    "mypy (>=2.2.0,<3.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
]


[build-system]
# 2.2.0 is the first release that understands PEP 639 -- below it the backend emits the
# deprecated `License:` field, re-adds the license classifier and drops `:: 3.14`.
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
# target-version is inferred from requires-python -- the floor is single-sourced there
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# Deliberately excluded:
#   TC  - would move pydantic-validated imports under TYPE_CHECKING, breaking the
#         runtime annotation resolution that pydantic depends on
#   Q   - the CI-gated formatter normalizes quotes everywhere it runs
ignore = [
    # Typographic punctuation flagged as confusable. Every docstring here is the spec
    # author's own description, copied verbatim -- normalizing their apostrophes and
    # dashes would silently alter the API's documentation.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["RUF022"]   # curated, grouped __all__

[tool.mypy]
python_version = "3.10"         # the supported floor, not whichever interpreter is local
files = ["maxio_advanced_billing"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "possibly-undefined"]
# already inside `strict` at mypy 2.3, pinned deliberately: `strict`'s flag set is versioned
# and the dev floor spans >=2.2.0,<3.0.0
warn_return_any = true
pretty = true
